name: JaCoCo report

on:
  pull_request:
    branches: [ master ]
    types: [ opened, edited, synchronize, reopened ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The project is built for (Scala 2.12, Spark 3.5), (Scala 2.13, Spark 3.5) and (Scala 2.13, Spark 4.1)
          # The CI runs all tests suites for all of them at build.yml
          # The codebase is shared but the runtime paths differ per Spark major version ( ANSI mode is on by default
          # in Spark 4) so coverage is checked once per Spark major version:
          # - Scala 2.12 / Spark 3.5: supported by the wide range of Spark versions and vendor distributions
          # - Scala 2.13 / Spark 4.1: the only Spark 4 row
          - scala: 2.12.20
            scalaShort: "2.12"
            spark: 3.5.7
            project: standardization2_12Spark35
            overall: 80.0
            changed: 80.0
            per-changed-file: 60.0

          - scala: 2.13.17
            scalaShort: "2.13"
            spark: 4.1.2
            project: standardizationSpark41
            overall: 75.0
            changed: 80.0
            per-changed-file: 60.0
    name: JaCoCo - Scala ${{matrix.scala}}, Spark ${{matrix.spark}}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Build and run tests
        run: sbt "project ${{matrix.project}}" jacoco

      - name: Add JaCoCo Report in PR comments
        id: jacoco
        uses: MoranaApps/jacoco-report@3575c005e31adda0bf6868b69d48a0114e912845
        with:
          paths: |
            **/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          global-thresholds: '${{ matrix.overall }}*${{ matrix.changed }}'
          report-thresholds-default: '${{ matrix.overall }}*${{ matrix.changed }}*${{ matrix.per-changed-file }}'
          title: JaCoCo code coverage report - scala ${{ matrix.scala }}, spark ${{ matrix.spark }}
          update-comment: true

      - name: Get the Coverage info
        run: |
          echo "Total coverage ${{ steps.jacoco.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.jacoco.outputs.coverage-changed-files }}"

